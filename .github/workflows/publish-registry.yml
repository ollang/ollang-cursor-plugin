name: Publish MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-mcp-registry
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'ollang/ollang-cursor-plugin' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate distribution package
        run: python3 scripts/validate.py
      - name: Download verified publisher
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz \
            --output mcp-publisher.tar.gz
          echo '1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340  mcp-publisher.tar.gz' | sha256sum --check
          tar -xzf mcp-publisher.tar.gz mcp-publisher
      - name: Validate registry metadata
        run: '"${{ runner.temp }}/mcp-publisher" validate registry/server.json'
      - name: Authenticate using GitHub organization identity
        run: '"${{ runner.temp }}/mcp-publisher" login github-oidc'
      - name: Publish registry listing
        run: '"${{ runner.temp }}/mcp-publisher" publish registry/server.json'
